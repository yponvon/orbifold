[project]
name = "orbifold"
version = "0.1.0"
description = "Real-to-sim reconstruction of an ironing recording from MCAP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcap>=1.2",
    "mcap-protobuf-support>=0.5",
    "protobuf>=5",
    "zstandard>=0.22",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Blender as a Python module; pinned to match desktop Blender 5.2.2 LTS
render = ["bpy==5.2.2"]
# Body model fitting: Anny (Apache-2.0, MakeHuman-based; no registration) on the 5090
body = ["torch>=2.7", "anny>=0.6.1"]
# Room reconstruction: Gaussian splats of the static room, person masks (5090 box)
recon = ["torch>=2.7", "torchvision>=0.22", "gsplat>=1.5", "ultralytics>=8.3", "lpips>=0.1.4"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "pre-commit>=3.7"]

# On Linux (the 5090), take CUDA 12.8 PyTorch builds: matches the box's nvcc, which
# gsplat uses to compile its kernels. macOS gets the default PyPI builds.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbifold"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
