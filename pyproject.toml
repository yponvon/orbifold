[project]
name = "orbifold"
version = "0.1.0"
description = "Real-to-sim reconstruction of an ironing recording from MCAP"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcap>=1.2",
    "mcap-protobuf-support>=0.5",
    "protobuf>=5",
    "zstandard>=0.22",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Installed on the 5090 box only: `uv sync --extra gpu`
gpu = [
    "torch>=2.7",
    "smplx>=0.1.28",
    "bpy>=4.2,<4.3",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbifold"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
